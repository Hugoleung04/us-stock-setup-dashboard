<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Stock Setup Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --green: #10b981;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .subtitle { color: var(--muted); margin-bottom: 24px; }
    .disclaimer {
      background: #1e293b;
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin-bottom: 24px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; margin-top: 24px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
    }
    .card h2 { margin: 0 0 16px; font-size: 1.2rem; }
    .sector-item, .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2d3748;
    }
    .sector-item:last-child, .stock-item:last-child { border-bottom: none; }
    .badge {
      background: #334155;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .setup { color: var(--green); font-weight: 600; }
    .loading { color: var(--muted); }
    .meta { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>US Stock Setup Dashboard</h1>
    <p class="subtitle">當日符合技術規則嘅股票 · 按板塊顯示活躍度</p>

    <div class="disclaimer">
      <strong>免責聲明：</strong> 呢個係教育同分析工具，唔係投資建議。
      「符合規則」唔等於值得買。大部分日內交易者都會輸錢。數據來自免費公開來源，可能有延遲。
    </div>

    <button id="scanBtn" onclick="runScan()">重新掃描</button>
    <span id="status" class="loading"></span>

    <div class="grid" id="results" style="display:none;">
      <div class="card">
        <h2>板塊活躍度</h2>
        <div id="sectors"></div>
      </div>
      <div class="card">
        <h2>符合規則嘅股票（最多 5 隻）</h2>
        <div id="stocks"></div>
        <div class="meta" id="scanMeta"></div>
      </div>
    </div>
  </div>

  <script>
    async function runScan() {
      const btn = document.getElementById('scanBtn');
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      btn.disabled = true;
      status.textContent = '掃描中...（可能要 1–2 分鐘）';
      results.style.display = 'none';

      try {
        const res = await fetch('/api/scan');
        const data = await res.json();
        if (data.error) {
          status.textContent = '錯誤：' + data.error;
          btn.disabled = false;
          return;
        }

        // Sectors
        const sectorsEl = document.getElementById('sectors');
        sectorsEl.innerHTML = data.sector_summary.length
          ? data.sector_summary.map(s => `
              <div class="sector-item">
                <span>${s.sector}</span>
                <span class="badge">${s.count} 隻</span>
              </div>
            `).join('')
          : '<div class="loading">暫時冇符合規則嘅股票</div>';

        // Stocks
        const stocksEl = document.getElementById('stocks');
        stocksEl.innerHTML = data.top_setups.length
          ? data.top_setups.map(h => `
              <div class="stock-item">
                <div>
                  <strong>${h.symbol}</strong>
                  <span class="setup">${(h.setups || []).join(', ')}</span>
                </div>
                <div>
                  $${h.price?.toFixed(2) || '—'}
                  <span class="badge">${(h.volume / 1e6).toFixed(1)}M</span>
                </div>
              </div>
            `).join('')
          : '<div class="loading">暫時冇符合規則嘅股票</div>';

        document.getElementById('scanMeta').textContent =
          `掃描至 ${data.as_of || '—'} · 已掃描 ${data.scanned || 0} 隻 · 符合規則 ${data.hits_count || 0} 隻`;

        results.style.display = 'grid';
        status.textContent = '完成';
      } catch (e) {
        status.textContent = '請求失敗：' + e.message;
      }
      btn.disabled = false;
    }
  </script>
</body>
</html>
