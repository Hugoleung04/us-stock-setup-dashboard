<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Stock Setup Dashboard</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #161b22;
      --card-hover: #1c232c;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }
    .disclaimer {
      background: #1c2128;
      border: 1px solid var(--border);
      border-left: 3px solid #f59e0b;
      padding: 12px 14px;
      margin: 16px 0 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #30363d; }
    button.secondary:hover { background: #3d444d; }
    button.purple { background: var(--purple); }
    button.purple:hover { background: #7c3aed; }
    button.green { background: var(--green); }
    button.green:hover { background: #059669; }
    .status { color: var(--muted); font-size: 0.9rem; align-self: center; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }
    .heatmap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .heat-item {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      min-width: 90px;
      text-align: center;
      background: #1c232c;
    }
    .heat-item strong { display: block; font-size: 1.15rem; }
    .stock-item, .sector-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .stock-item:last-child, .sector-item:last-child { border-bottom: none; }
    .badge {
      background: #30363d;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
    .setup { color: var(--green); font-weight: 600; font-size: 0.85rem; }
    .meta { font-size: 0.8rem; color: var(--muted); }
    .win { color: var(--green); font-weight: 600; }
    .loss { color: var(--red); font-weight: 600; }
    .pending { color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 800px) {
      .grid { grid-template-columns: 0.9fr 1.1fr; }
    }
    #results, #recsCard { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>US Stock Setup Dashboard</h1>
      <p class="subtitle">當日符合技術規則嘅股票 · 按板塊顯示活躍度</p>
    </header>

    <div class="disclaimer">
      <strong>免責聲明：</strong> 呢個係教育同分析工具，唔係投資建議。「符合規則」唔等於值得買。大部分日內交易者都會輸錢。數據來自免費公開來源，可能有延遲。
    </div>

    <div class="btn-row">
      <button id="scanDaily" onclick="runScan('daily')">日線掃描</button>
      <button class="purple" onclick="runScan('orb')">開市突破 (ORB)</button>
      <button class="green" onclick="loadAndCheck()">查最近 15 隻表現</button>
      <span id="status" class="status"></span>
    </div>

    <div class="grid" id="results">
      <div class="card">
        <h2>板塊活躍度</h2>
        <div id="heatmap" class="heatmap"></div>
        <div id="sectors"></div>
      </div>
      <div class="card">
        <h2>符合規則嘅股票</h2>
        <div id="stocks"></div>
        <div class="meta" id="scanMeta"></div>
      </div>
    </div>

    <div class="card" id="recsCard">
      <h2>最近 15 隻推薦 · 由推薦到而家</h2>
      <div id="recsSummary" class="meta" style="margin-bottom:12px;"></div>
      <div id="recsList"></div>
    </div>
  </div>

  <script>
    async function runScan(mode = 'daily') {
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      status.textContent = mode === 'orb' ? '掃描開市突破中...' : '日線掃描中...';
      results.style.display = 'none';

      try {
        const res = await fetch('/api/scan?mode=' + mode);
        const data = await res.json();
        if (data.error) {
          status.textContent = '錯誤：' + data.error;
          return;
        }

        const maxCount = Math.max(...(data.sector_summary||[]).map(s => s.count), 1);
        document.getElementById('heatmap').innerHTML = (data.sector_summary||[]).map(s => {
          const intensity = Math.round(25 + (s.count / maxCount) * 55);
          return `<div class="heat-item" style="background:hsl(210,50%,${intensity}%);">
            <strong>${s.count}</strong>${s.sector}
          </div>`;
        }).join('') || '<div class="meta">暫無</div>';

        document.getElementById('sectors').innerHTML = (data.sector_summary||[]).map(s => `
          <div class="sector-item">
            <span>${s.sector}</span>
            <span class="badge">${s.count}</span>
          </div>
        `).join('') || '<div class="meta">暫時冇</div>';

        document.getElementById('stocks').innerHTML = (data.top_setups||[]).map(h => `
          <div class="stock-item">
            <div>
              <strong>${h.symbol}</strong>
              <span class="setup">${(h.setups||[]).join(', ')}</span>
              ${h.rsi ? `<span class="badge">RSI ${h.rsi}</span>` : ''}
            </div>
            <div>
              $${h.price?.toFixed(2) || '—'}
              <span class="badge">${(h.volume/1e6).toFixed(1)}M</span>
            </div>
          </div>
        `).join('') || '<div class="meta">暫時冇符合規則嘅股票</div>';

        document.getElementById('scanMeta').textContent =
          `${data.mode||'daily'} · 至 ${data.as_of||'—'} · 掃描 ${data.scanned||0}/${data.universe||'—'} · 流動性 ${data.liquid_rate_pct||0}% · 符合 ${data.hits_count||0} 隻`;

        results.style.display = 'grid';
        status.textContent = '完成';
      } catch (e) {
        status.textContent = '請求失敗：' + e.message;
      }
    }

    async function loadAndCheck() {
      const status = document.getElementById('status');
      const card = document.getElementById('recsCard');
      status.textContent = '查緊最近 15 隻表現...';
      card.style.display = 'none';

      try {
        // First trigger update
        await fetch('/api/recommendations/check');
        // Then load
        const res = await fetch('/api/recommendations');
        const data = await res.json();

        const s = data.stats || {};
        document.getElementById('recsSummary').innerHTML = Object.entries(s)
          .filter(([_, st]) => st.checked > 0)
          .map(([tf, st]) => `${tf}: ${st.win_rate_pct}% (${st.wins}/${st.checked})`)
          .join(' · ') || '未有足夠時間框架數據';

        document.getElementById('recsList').innerHTML = (data.recent||[]).map(r => {
          const chg = r.change_1d ?? r.change_1w ?? r.change_1m ?? r.change_6m;
          const outcome = r.outcome_1d ?? r.outcome_1w ?? r.outcome_1m ?? r.outcome_6m;
          const chgStr = chg != null ? `${chg > 0 ? '+' : ''}${chg}%` : '—';
          const cls = outcome === 'win' ? 'win' : outcome === 'loss' ? 'loss' : 'pending';
          const label = outcome ? outcome.toUpperCase() : '待更新';
          return `
            <div class="stock-item">
              <div>
                <strong>${r.symbol}</strong>
                <span class="meta">${r.date} @ $${r.price?.toFixed(2)||'—'}</span>
                ${r.setups ? `<span class="badge">${(r.setups||[]).join(', ')}</span>` : ''}
              </div>
              <div style="text-align:right;">
                <div class="${cls}">${label}</div>
                <div>${chgStr}</div>
                ${r.current_price ? `<div class="meta">現 $${r.current_price.toFixed(2)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('') || '<div class="meta">暫時冇記錄。先掃描再查。</div>';

        card.style.display = 'block';
        status.textContent = '完成';
      } catch (e) {
        status.textContent = '查詢失敗：' + e.message;
      }
    }
  </script>
</body>
</html>
